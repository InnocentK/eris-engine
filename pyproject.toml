[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eris-engine"
description = "Evidence-bound adversarial multi-model review harness (Phase 0)."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
# Loose bounds for packaging only. requirements.txt is the single source of
# exact pins and is what CI and `task setup` install.
dependencies = [
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.28,<1",
]

[project.scripts]
eris = "eris.cli:main"

[tool.setuptools.dynamic]
version = { attr = "eris.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["eris"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = ["src"]
warn_unreachable = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers -p no:cacheprovider"
markers = [
  "real_subprocess(allow=...): test may spawn a real process; argv[0] limited to sys.executable, sleep, or the basenames listed in allow",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src", "eval"]
branch = true

[tool.coverage.report]
# Coverage ratchet: this floor only goes UP. Raise it when the measured number
# clears the new floor with margin; never lower it to make a gate pass.
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
