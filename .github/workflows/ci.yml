name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact pins
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests eval
          ruff format --check src tests eval
      - name: Typecheck
        run: |
          mypy
          mypy --ignore-missing-imports eval
      - name: Test with coverage floor
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: pip-audit (blocking)
        run: pip-audit -r requirements.txt --strict --progress-spinner off
