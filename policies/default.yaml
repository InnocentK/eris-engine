# Eris policy: declared workers, allowlists, budgets, vendors.
#
# - NO secrets here (a secret-shaped value refuses the load). Secrets go in .env;
#   `env_allow` lists the NAMES passed to a worker. Declaring a name makes it
#   REQUIRED: if it is absent from .env the worker is REFUSED at launch
#   ("env_allow names not provided"), it is not silently skipped
#   (`launch.plan_call`, `test_launch.py::test_plan_call_builds_argv_env_cwd_...`).
#   So a name declared here must exist on EVERY host that runs this policy.
# - `executable_sha256: UNPINNED` is a placeholder. Run `eris policy pin` to
#   write machine-specific hashes to policies/pins.yaml (gitignored). Unpinned
#   workers load but are refused at launch.
# - `trusted: false` means verification may not execute repository code
#   (pytest is refused); flip only for repos you own after reading SECURITY.md.
# - Model ids marked ASSUMPTION were not verified against a live account.

policy_version: "2026-08-22.2"
trusted: false
runs_dir: runs
cache_dir: cache                # worker-call cache (redacted bytes only); never under runs/
scratch_dir: cache/scratch      # every ephemeral file (per run id); never under runs/; swept at startup
scratch_retention_s: 604800     # hard bound: scratch older than this is swept even if liveness is unprovable
path_env: /usr/bin:/bin:/usr/local/bin:/opt/homebrew/bin
vendors_allowed: [anthropic, openai, xai, google]
api_hosts_allowed: [api.openai.com, api.x.ai, localhost, 127.0.0.1]
# All four files verified to EXIST on this machine on 2026-08-22. A declared
# file that is missing is a doctor WARN; one that exists but cannot be parsed
# refuses the run (its secrets could not be added to the redactor).
# ~/.gemini/antigravity-cli/settings.json (126 B, mode 600) held only
# enableTelemetry/trustedWorkspaces when inspected; where agy keeps its OAuth
# token is UNKNOWN (A8: auth is HOME-rooted). Declared so that anything
# secret-shaped that appears there is redacted.
# ~/.grok/auth.json was declared until 2026-08-23 and REMOVED: `eris doctor`
# reports it absent - the Grok CLI no longer creates it. Where grok keeps its
# credentials is UNKNOWN; re-declare the file if it reappears.
credential_files:
  - ~/.codex/auth.json
  - ~/.claude/.credentials.json
  - ~/.gemini/oauth_creds.json
  - ~/.gemini/antigravity-cli/settings.json

workers:
  claude:
    transport: cli
    cli: claude
    provider: anthropic
    model: claude-fable-5         # PINNED 2026-08-31. Was `null` (= CLI default), which ran
                                  # claude-fable-5 anyway: a CLI update could have changed the
                                  # model under a binary whose hash still matched its pin, the
                                  # one drift the pin check cannot see. `--model claude-fable-5`
                                  # was executed against this CLI before pinning (S0-2).
    executable_sha256: UNPINNED
    timeout_s: 600
    max_stdout_bytes: 10000000
    max_stderr_bytes: 1000000
    # RAISED from 1.0 on 2026-08-31. This cap binds `claude` and `judge` only -
    # they are the only workers given `--max-budget-usd` - so it is sized from
    # THEIR cost-reporting executed calls, 27 of them across b-s1 and b-s3:
    #   claude/propose     n=10  mean $0.583  max $0.770
    #   claude/critique    n= 3  mean $0.803  max $0.931
    #   judge/adjudicate   n=14  mean $0.722  max $0.920
    # The largest is $0.931. grok's 19 calls (mean $0.078, max $0.104) are
    # listed nowhere above because grok has no cap; they cannot inform this one.
    #
    # Every `invocation.finished` record in those two campaigns, so the set is
    # named rather than implied - 80 records:
    #     46  executed ok, cost reported   <- 27 claude/judge (above) + 19 grok
    #     16  executed ok, NO cost         <- codex/agy in b-s1; uncapped, and
    #                                         invisible to any figure here
    #      2  aborted (budget_tripped)     <- partial spend, not a call cost
    #      2  failed, and NOT two of a kind:
    #           1  agy in b-s1, 'agy: timeout waiting for response', which
    #              retried and succeeded - so one logical call booked $2 TWICE
    #           1  grok in b-s3, killed by the deliberate SIGINT
    #         Neither reported a cost, but Eris booked per_call_usd for each
    #         (counted, estimated), so both ARE in committed spend
    #     14  cache replays                <- re-attribute a call already counted
    #
    # This note has now been wrong FOUR times, never about the arithmetic:
    #   1. quoted the two aborted partials as call costs
    #   2. counted 60 "completed calls", 14 of them replays
    #   3. called 46 "the calls executed" when 62 executed, 16 reporting no cost
    #   4. labelled both failures "interrupted" when one is an agy TIMEOUT
    # The first three are the same mistake - which records are in the set - and
    # enumerating the population fixed them. The fourth survived that fix,
    # because enumerating a class does not check that its LABEL is true of every
    # member: the count was right and the name was wrong. Both are needed, and
    # the only thing that has caught either is reading the records themselves.
    # At 1.0 a critic call and an adjudicator call on plan-sized documents were
    # ABORTED mid-flight - `error_max_budget_usd` / `budget_exhausted` - which
    # cost arm 4 both of its plan cells and left b-s3's paired comparison
    # uncomputable.
    # The cap is observed AFTER a charge, not before one, so a call aborts PAST
    # its limit by up to one indivisible charge. Those two aborts reported
    # $1.038 and $1.132 against a $1.00 cap (+3.8%, +13.2%), and S0-4's $0.05
    # cap returned $0.098 (+97%, one $0.097 cache creation exceeding the cap by
    # itself). No call has ever COMPLETED above its cap.
    # $4.00 is ~4.3x the largest executed call - room for the two stages that
    # wanted more than $1. It does NOT make per_run_usd hard: see
    # `Policy._call_cap_fits_the_reservation` for what the ceiling is worth.
    max_budget_usd: 4.0
    tools: [Read, Grep, Glob]
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
  judge:                          # dedicated adjudicator/summarizer: text only, NO tools
    transport: cli
    cli: claude
    provider: anthropic
    model: claude-fable-5         # PINNED 2026-08-31, same reason as `claude` above (S0-2)
    executable_sha256: UNPINNED
    timeout_s: 300                # a judge TIMEOUT is terminal (E8 hang is deterministic)
    max_stdout_bytes: 10000000
    max_stderr_bytes: 1000000
    max_budget_usd: 4.0            # raised with `claude` above, same evidence
    tools: []
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
  codex:
    transport: cli
    cli: codex
    provider: openai
    model: gpt-5.4                # ASSUMPTION - verify against your account
    executable_sha256: UNPINNED
    timeout_s: 600
    max_stdout_bytes: 10000000
  grok:                           # grok CLI 1.0.30, re-pinned 2026-09-13 after drift
                                  # from the Sep 6 pin (binary replaced 2026-09-13).
                                  # Re-verified before authorising: all emitted flags
                                  # present, plan mode still blocks writes (T7 shape,
                                  # stopReason cancelled), parse_grok reads the live
                                  # envelope (model grok-4.6, cost reported; new
                                  # additive key total_cost_usd_ticks, ignored).
    transport: cli
    cli: grok
    provider: xai
    model: grok-4.6               # observed in the 2026-08-21 capture
    executable_sha256: UNPINNED
    timeout_s: 600
    max_stdout_bytes: 10000000
    sanitize_snapshot: true       # E1: repo instruction injection observed once; strip the files
    # REQUIRED, not optional: declaring a name here makes it mandatory on every
    # host (see the header). Without XAI_API_KEY in .env grok is REFUSED at
    # launch: "policy_terminal: status refused: env_allow names not provided:
    # ['XAI_API_KEY']". Verified 2026-08-27, both directions.
    # Verified on THIS machine (M2c live run): grok reads XAI_API_KEY,
    # ~/.grok/auth.json is absent, and without it the from-{} env yields
    # "Not signed in" - the same class as the USER defect.
    # PORTABILITY (M2c-2): this is a machine-specific credential requirement in
    # a TRACKED policy - the same wart as the absolute verify executables below.
    # A host where grok authenticates another way (`grok login --device-code`
    # implies a stored token; UNVERIFIED) must remove this line or add the key.
    env_allow: [XAI_API_KEY]
  agy:                            # Antigravity CLI 1.2.2, re-pinned 2026-09-13 (third
                                  # pin: 1.1.18 -> 1.1.27 -> 1.2.2). The auto-updater
                                  # replaced the binary MID-SESSION this time - 1.2.1
                                  # was verified at ~18:45, the updater installed 1.2.2
                                  # at 18:50, and `policy pin` hashed 1.2.2 at 18:51 -
                                  # so the suite was RE-RUN against the pinned 1.2.2
                                  # (sha checked before and after the probes: stable,
                                  # equals the pin): flags, model listing, schema
                                  # honoured, outside-read auto-denied, no leak.
                                  # settings.json now holds only trustedWorkspaces -
                                  # still no secrets. Google lineage; `gemini` is gone.
    transport: cli
    cli: agy
    provider: google
    model: gemini-3.1-pro-high    # listed by `agy models` 2026-08-22; NOT observed executing
                                  # (the envelope carries no model id). Must start with
                                  # "gemini-" (lineage guard in eris.policy).
    executable_sha256: UNPINNED
    timeout_s: 600                # --print-timeout is derived: timeout_s - 30 (above 60 s)
    max_stdout_bytes: 10000000
    sanitize_snapshot: true       # A15: agy injects the workspace's AGENTS.md/GEMINI.md rules
    env:
      AGY_CLI_DISABLE_AUTO_UPDATE: "1"  # name from the binary's strings; effect ASSUMPTION.
                                        # agy spawns a background auto-updater that would
                                        # change the binary under its pin (doctor: re-pin).
  openai-api:
    transport: api
    provider: openai
    model: gpt-5.4                # ASSUMPTION
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    executable_sha256: UNPINNED   # not applicable to api transport; required key kept uniform
    timeout_s: 300
    max_stdout_bytes: 10000000
    env_allow: [OPENAI_API_KEY]

verify:
  max_output_bytes: 2000000
  max_requests_per_run: 12        # model-proposed evidence requests executed per run
  max_wall_s: 1800                # wall-clock budget for all evidence requests of a run
  commands:
    # `eris policy pin` must pin git: the pin gates BOTH model-proposed git
    # commands and the tripwire's internal `ls-files -s -v` index digest,
    # which falls back to hashing `.git/index` bytes without a pinned git.
    git:
      executable: /usr/bin/git
      executable_sha256: UNPINNED
      subcommands: [diff, log, grep, show, status, ls-files, blame, rev-parse]
      literal_flags: ["--stat", "--name-only", "--name-status", "-p", "--no-color", "--oneline", "-l", "--porcelain", "--numstat", "--follow", "-w", "--cached"]
      value_flags:
        "-n": "^[0-9]{1,4}$"
        "--max-count": "^[0-9]{1,4}$"
        "-e": "^[^\\x00\\n]{1,200}$"
        "--format": "^[%A-Za-z0-9 ():,_-]{1,80}$"
        "-L": "^[0-9]{1,6},[0-9]{1,6}$"
      positional: ["path", "^(HEAD(~[0-9]{1,3})?|[0-9a-f]{7,40})(\\.\\.[0-9a-fA-Z~^]{1,44})?$"]
    ruff:
      executable: /opt/homebrew/bin/ruff
      executable_sha256: UNPINNED
      subcommands: [check]
      literal_flags: ["--no-fix", "--quiet", "--no-cache", "--output-format=concise", "--output-format=json"]
      value_flags:
        "--select": "^[A-Z0-9,]{1,64}$"
      positional: ["path"]
    mypy:
      executable: /opt/homebrew/bin/mypy
      executable_sha256: UNPINNED
      literal_flags: ["--strict", "--no-incremental", "--no-error-summary", "--hide-error-context", "--ignore-missing-imports", "--no-color-output", "--show-error-codes"]
      positional: ["path"]
    pytest:
      executable: /opt/homebrew/bin/pytest
      executable_sha256: UNPINNED
      requires_trusted: true
      literal_flags: ["-q", "-x", "--no-header", "--tb=short", "--tb=no", "--color=no"]
      value_flags:
        "-p": "^no:[A-Za-z0-9_]+$"
        "-r": "^[fEsxXpPaAwN]{1,8}$"
        "-k": "^[A-Za-z0-9_ ]{1,120}$"
        "-m": "^[A-Za-z0-9_ ]{1,60}$"
        "--maxfail": "^[0-9]{1,3}$"
      positional: ["path"]

# Containment of worker READS (E1): null = accept-and-scan only; "container"
# once M2c provides one. The scorer refuses defect/ABSTAIN categories without it.
containment: null

budgets:
  per_run_usd: 20.0
  # Reservation booked for a call with no reported cost, AND the pre-call
  # margin `BudgetLedger.precheck` leaves against per_run_usd. Those are two
  # jobs for one number, and the second one binds: a capped worker whose
  # max_budget_usd exceeds this can be admitted with this much headroom and
  # then spend more, carrying the cell past per_run_usd with nothing to
  # refuse it. Raised 2.0 -> 4.0 with claude/judge's cap; `Policy.
  # _call_cap_fits_the_reservation` now refuses a policy where a cap exceeds
  # it. Cost note: this DOUBLES what a missing-cost call reserves, so a
  # four-family campaign reserves 2x what the S3 sizing table says.
  per_call_usd: 4.0
  per_campaign_usd: 200.0

# Snapshot sanitization (eris.sanitize) for workers with `sanitize_snapshot: true`.
# The R3.1 minimum (AGENTS.md, CLAUDE.md, CLAUDE.local.md, GEMINI.md, GROK.md;
# .agents, .claude, .codex, .gemini, .grok, .antigravity, .cursor,
# .github/copilot-instructions.md) ALWAYS applies; entries here are additions.
sanitize:
  strip_names: []
  strip_dirs: []

# Contamination scan (eris.scan): extra literal strings. The answer-key
# derived patterns (source path, fix hunks) come from key.json at run time.
scan:
  patterns_from_policy: []
